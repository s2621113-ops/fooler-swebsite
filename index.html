<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임 많이하는 사람한테 보여주세요</title>
    <style>
        /* 기본 배경 설정: 깊은 다크톤 */
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 메인 타이틀: 네온 레드 효과 */
        h1 {
            color: #ff4d4d;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.7), 0 0 20px rgba(255, 77, 77, 0.5);
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* 비디오를 감싸는 컨테이너: 그림자와 라운딩 처리 */
        .video-wrapper {
            position: relative;
            width: 90%;
            max-width: 800px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 15px rgba(196, 14, 14, 0.3);
            border: 1px solid #333;
        }

        /* 비디오 비율 유지 (16:9) */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 하단 메시지 스타일 */
        .footer-text {
            margin-top: 25px;
            color: #888;
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* 배경에 은은한 붉은 광원 효과 */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(196, 14, 14, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <h1>⚠️ 친일제 게임 좀 그만해</h1>

    <div class="video-wrapper">
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/W0lT-wp_WLQ?si=DGf4QivQfEPjKyLQ" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <p class="footer-text">지금 게임 끌 시간입니다. 진지해요.</p>

</body>
</html>
